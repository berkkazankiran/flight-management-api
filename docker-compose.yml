services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
        VITE_SOCKET_URL: http://localhost:5000

    container_name: flight-frontend

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      web:
        condition: service_started
  web:
    build: .
    container_name: flight-api

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_NAME: flightdb
      DB_USER: berk
      DB_PASSWORD: "1234"
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: flight-db

    environment:
      POSTGRES_DB: flightdb
      POSTGRES_USER: berk
      POSTGRES_PASSWORD: "1234"

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berk -d flightdb"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - flight-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: flight-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flight.com
      PGADMIN_DEFAULT_PASSWORD: "1234"

    ports:
      - "8080:80"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - pgadmin-data:/var/lib/pgadmin
  
  redis:
    image: redis:7-alpine
    container_name: flight-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10



  kafka:
    image: apache/kafka:4.3.1
    container_name: flight-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1

    volumes:
      - kafka-data:/var/lib/kafka/data

  consumer:
    build: .
    container_name: flight-consumer
    restart: unless-stopped

    command: python consumer.py

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_NAME: flightdb
      DB_USER: berk
      DB_PASSWORD: "1234"
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: live-flights

    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  updater:
    build: .
    container_name: flight-updater
    restart: unless-stopped

    command: python updater.py

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: live-flights

    depends_on:
      kafka:
        condition: service_started

volumes:
  flight-data:
  pgadmin-data:
  kafka-data: