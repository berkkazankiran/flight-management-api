apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-frontend
  template:
    metadata:
      labels:
        app: flight-frontend
    spec:
      containers:
        - name: flight-frontend
          image: berkkazankiran/flight-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: flight-frontend-service
spec:
  selector:
    app: flight-frontend
  ports:
    - port: 80
      targetPort: 80
  type: NodePort