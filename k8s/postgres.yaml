apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-postgres
spec:
  replicas: 1

  selector:
    matchLabels:
      app: flight-postgres

  template:
    metadata:
      labels:
        app: flight-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: "flightdb"

            - name: POSTGRES_USER
              value: "berk"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flight-secrets
                  key: DB_PASSWORD

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: flight-postgres

  ports:
    - port: 5432
      targetPort: 5432

  type: ClusterIP